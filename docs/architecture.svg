<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial">
  <title>notebooklm-claude-workflows — pipeline architecture</title>
  <desc>Architecture: a slash command in Claude Code drives a deterministic three-phase pipeline (Collect → Analyze → Artifacts) over the notebooklm-mcp-cli MCP tools. Each phase issues a sequence of MCP calls (notebook_create, source_add, notebook_query, studio_create) so the user never has to orchestrate them manually.</desc>

  <rect x="0" y="0" width="980" height="460" fill="#0d1117"/>

  <text x="490" y="32" text-anchor="middle" font-size="18" fill="#e6edf3" font-weight="600">How a slash command turns one prompt into a deterministic pipeline</text>
  <text x="490" y="52" text-anchor="middle" font-size="12" fill="#7d8590">user types one line · Claude Code runs the workflow · MCP tools execute</text>

  <!-- User prompt -->
  <rect x="40" y="80" width="200" height="56" rx="10" fill="#1f2937" stroke="#cc785c"/>
  <text x="140" y="106" text-anchor="middle" font-size="12" fill="#cc785c" font-weight="700">user prompt</text>
  <text x="140" y="124" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3">/research AI agents 2025</text>

  <!-- arrow -->
  <line x1="240" y1="108" x2="288" y2="108" stroke="#4b5563" stroke-width="2"/>
  <polygon points="296,108 284,102 284,114" fill="#4b5563"/>

  <!-- Slash command resolves to recipe -->
  <rect x="296" y="80" width="240" height="56" rx="10" fill="#1f2937" stroke="#cc785c"/>
  <text x="416" y="106" text-anchor="middle" font-size="12" fill="#cc785c" font-weight="700">commands/research.md</text>
  <text x="416" y="124" text-anchor="middle" font-size="11" fill="#9ca3af">3-phase recipe loaded by Claude Code</text>

  <!-- arrow down -->
  <line x1="416" y1="136" x2="416" y2="172" stroke="#4b5563" stroke-width="2"/>
  <polygon points="416,180 410,168 422,168" fill="#4b5563"/>

  <!-- Phase 1: Collect -->
  <rect x="40" y="190" width="280" height="100" rx="10" fill="#1f2937" stroke="#3b9eff"/>
  <text x="180" y="214" text-anchor="middle" font-size="13" fill="#3b9eff" font-weight="700">Phase 1 — Collect</text>
  <text x="56" y="236" font-size="11" fill="#d1d5db">• prompt user for sources</text>
  <text x="56" y="252" font-size="11" fill="#d1d5db">• <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcdcaa">notebook_create</tspan> &amp; <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcdcaa">source_add</tspan> ×N</text>
  <text x="56" y="268" font-size="11" fill="#d1d5db">• optional <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcdcaa">research_start</tspan> (auto-expand)</text>
  <text x="56" y="284" font-size="11" fill="#d1d5db">• always <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcdcaa">wait=true</tspan> on each source</text>

  <!-- arrow -->
  <line x1="320" y1="240" x2="368" y2="240" stroke="#4b5563" stroke-width="2"/>
  <polygon points="376,240 364,234 364,246" fill="#4b5563"/>

  <!-- Phase 2: Analyze -->
  <rect x="376" y="190" width="280" height="100" rx="10" fill="#1f2937" stroke="#9d6cff"/>
  <text x="516" y="214" text-anchor="middle" font-size="13" fill="#9d6cff" font-weight="700">Phase 2 — Analyze</text>
  <text x="392" y="236" font-size="11" fill="#d1d5db">• <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcdcaa">notebook_query</tspan> — summary</text>
  <text x="392" y="252" font-size="11" fill="#d1d5db">• <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcdcaa">notebook_query</tspan> — patterns</text>
  <text x="392" y="268" font-size="11" fill="#d1d5db">• <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcdcaa">notebook_query</tspan> — contradictions</text>
  <text x="392" y="284" font-size="11" fill="#d1d5db">• cite-anchored structured report</text>

  <!-- arrow -->
  <line x1="656" y1="240" x2="704" y2="240" stroke="#4b5563" stroke-width="2"/>
  <polygon points="712,240 700,234 700,246" fill="#4b5563"/>

  <!-- Phase 3: Artifacts -->
  <rect x="712" y="190" width="220" height="100" rx="10" fill="#1f2937" stroke="#22c55e"/>
  <text x="822" y="214" text-anchor="middle" font-size="13" fill="#22c55e" font-weight="700">Phase 3 — Artifacts</text>
  <text x="728" y="236" font-size="11" fill="#d1d5db">• <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcdcaa">studio_create</tspan> · audio</text>
  <text x="728" y="252" font-size="11" fill="#d1d5db">• <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcdcaa">studio_create</tspan> · mind_map</text>
  <text x="728" y="268" font-size="11" fill="#d1d5db">• <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcdcaa">studio_create</tspan> · flashcards</text>
  <text x="728" y="284" font-size="11" fill="#d1d5db">• <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcdcaa">studio_create</tspan> · briefing</text>

  <!-- MCP layer separator -->
  <line x1="40" y1="324" x2="940" y2="324" stroke="#374151" stroke-dasharray="3 3"/>
  <text x="490" y="318" text-anchor="middle" font-size="11" fill="#7d8590">— MCP tool boundary —</text>

  <!-- MCP server box -->
  <rect x="200" y="340" width="580" height="56" rx="10" fill="#161b22" stroke="#dcdcaa"/>
  <text x="490" y="364" text-anchor="middle" font-size="13" fill="#dcdcaa" font-weight="700">notebooklm-mcp-cli (jacob-bd)</text>
  <text x="490" y="382" text-anchor="middle" font-size="11" fill="#9ca3af">browser-cookie auth · NotebookLM API · 12+ MCP tools</text>

  <!-- arrow into MCP -->
  <line x1="180" y1="290" x2="290" y2="340" stroke="#dcdcaa" stroke-dasharray="3 3" stroke-width="1.5"/>
  <line x1="516" y1="290" x2="516" y2="340" stroke="#dcdcaa" stroke-dasharray="3 3" stroke-width="1.5"/>
  <line x1="822" y1="290" x2="690" y2="340" stroke="#dcdcaa" stroke-dasharray="3 3" stroke-width="1.5"/>

  <!-- NotebookLM final -->
  <rect x="340" y="408" width="300" height="36" rx="10" fill="#1f2937" stroke="#3b9eff"/>
  <text x="490" y="431" text-anchor="middle" font-size="12" fill="#e6edf3">Google NotebookLM (browser-only product)</text>

  <line x1="490" y1="396" x2="490" y2="404" stroke="#3b9eff" stroke-width="2"/>
  <polygon points="490,412 484,400 496,400" fill="#3b9eff"/>
</svg>
